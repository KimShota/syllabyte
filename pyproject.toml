[project]
name = "syllabyte"
version = "0.1.0"
description = "SyllaByte — AI-powered micro-learning video generation from course syllabi and slides."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.7",
    "manim>=0.21",
    "pymupdf>=1.24.9",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    # Infra deps kept from the September scaffold (Docker/Mongo/Celery path,
    # not required for the file-based Week-1 pipeline).
    "celery>=5.4.0",
    "redis>=5.0.8",
    "pymongo>=4.8.0",
    "boto3>=1.34.153",
    "openai>=3.21.0",
    "catsim>=0.21.0",
    "manim-chemistry>=0.5.1",
    "manim-circuit>=0.0.3",
    "manim-eng>=0.1.0",
    "manim-dsa>=0.4.0",
    "manim-fa-physics>=0.2.0",
    "manim-voiceover>=0.4.0",
    "manim-neural-network>=0.1.0",
    "manim-ml>=0.0.24",
    "manim-3d>=0.1.1",
    "manim-astronomy>=0.0.5",
    "manim-cad-drawing-utils>=0.0.5",
    "manim-compass>=0.1.3",
    "manim-straightedge-compass>=0.1.1",
    "manim-automata>=0.2.14",
    "manim-sequence-diagram>=0.1.0",
    "manim-derivative-plotter>=1.0.7",
    "manim-extensions[algorithm,gearbox,physics]>=1.0.5",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.9"]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/common/syllabyte_common",
    "packages/ingestion_agent/ingestion_agent",
    "packages/curriculum_alignment_agent/curriculum_alignment_agent",
    "packages/script_generation_agent/script_generation_agent",
    "packages/animation_agent/animation_agent",
    "packages/assessment_agent/assessment_agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
