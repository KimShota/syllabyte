version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local dev — swap for real AWS S3
  # in the pilot deployment by unsetting SYLLABYTE_S3_ENDPOINT.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  ingestion_agent:
    build: ./packages/ingestion_agent
    depends_on:
      - mongo
      - redis
      - minio
    environment:
      SYLLABYTE_MONGO_URI: mongodb://mongo:27017
      SYLLABYTE_REDIS_URL: redis://redis:6379/0
      SYLLABYTE_S3_ENDPOINT: http://minio:9000

  animation_agent:
    build: ./packages/animation_agent
    depends_on:
      - mongo
      - redis
      - minio
    environment:
      SYLLABYTE_MONGO_URI: mongodb://mongo:27017
      SYLLABYTE_REDIS_URL: redis://redis:6379/0
      SYLLABYTE_S3_ENDPOINT: http://minio:9000

volumes:
  mongo_data:
  minio_data:
