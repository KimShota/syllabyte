<script>
  function selectOption(element, key) {
    const allOptions = document.querySelectorAll('.quiz-option');
    allOptions.forEach(opt => {
      opt.classList.remove('bg-primary-fixed/25', 'bg-secondary-fixed/25');
      opt.classList.add(opt.getAttribute('data-option') === 'D' ? 'bg-surface-container-low' : 'bg-surface-container-lowest');

      const circle = opt.querySelector('.w-8, .w-7');
      if (circle) {
        circle.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm', 'shadow-primary/30');
        circle.classList.add('bg-surface-container-high', 'text-on-surface-variant');
      }

      const check = opt.querySelector('.flex-shrink-0');
      if (check) {
        check.classList.remove('bg-primary', 'text-on-primary');
        check.classList.add('bg-surface-container-highest', 'text-transparent');
      }
    });

    // Apply active styling
    element.classList.remove('bg-surface-container-lowest', 'bg-surface-container-low');
    if (key === 'D') {
      element.classList.add('bg-secondary-fixed/25');
    } else {
      element.classList.add('bg-primary-fixed/25');
    }

    const badge = element.querySelector('.w-8, .w-7');
    if (badge) {
      badge.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
      badge.classList.add('bg-primary', 'text-on-primary', 'shadow-sm', 'shadow-primary/30');
    }

    const checkmark = element.querySelector('.flex-shrink-0');
    if (checkmark) {
      checkmark.classList.remove('bg-surface-container-highest', 'text-transparent');
      checkmark.classList.add('bg-primary', 'text-on-primary');
    }

    const nextBtn = document.getElementById('next-btn');
    if (nextBtn) {
      nextBtn.classList.remove('opacity-50', 'pointer-events-none');
    }
  }
</script></main>
